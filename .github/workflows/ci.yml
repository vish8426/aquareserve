name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (with API + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[api,dev]"

      - name: Lint (ruff)
        run: ruff check src tests backend

      - name: Validate example scenario config
        run: python -m aquareserve.cli validate

      - name: Precompute a small results store (so the API tests run)
        run: python scripts/run_matrix.py --reserves 5 20

      - name: Run tests with coverage
        run: pytest --cov=aquareserve --cov-report=term-missing

  frontend:
    name: Build web apps (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Install product app dependencies
        working-directory: product
        run: npm ci

      - name: Type-check and build product app
        working-directory: product
        run: npm run build

  deploy:
    name: Trigger Render deploy
    needs: [test, frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Kick Render deploy hook (if configured)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsSL -X POST "$HOOK"
            echo "Render deploy triggered."
          else
            echo "No RENDER_DEPLOY_HOOK secret set; relying on Render auto-deploy."
          fi
