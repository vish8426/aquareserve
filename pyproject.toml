[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquareserve"
version = "0.1.0"
description = "Smart supplementary irrigation digital twin - precision management of a finite water reserve to protect crop yield under drought."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "Vishant P" }]
keywords = ["irrigation", "digital-twin", "agriculture", "FAO-56", "MPC", "drought"]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Extras are pulled in as later phases land, keeping the core install light.

# Model Predictive Control. do-mpc brings CasADi, which is also used to build the perfect-foresight "oracle" optimisation (upper-bound benchmark).
control = [
    "do-mpc>=4.6",
    "casadi>=3.6",
]

# Reinforcement-learning comparison policy. The in-repo policy is trained by the Cross-Entropy Method (NumPy) and only needs Gymnasium for the environment; this extra is light and CI-safe.
rl = [
    "gymnasium>=0.29",
]

# Optional deep-RL path (Stable-Baselines3 PPO over the Gymnasium env). 
# Pulls in PyTorch, so it is kept out of the default/dev install and CI (ADR-012); install explicitly to run scripts/train_rl_sb3.py.
rl-deep = [
    "stable-baselines3>=2.2",
]

# Independent validation of our transparent engine against published models.
validation = [
    "pyfao56>=1.3",     # peer-reviewed FAO-56 dual-Kc soil-water balance
    "aquacrop>=3.0",    # AquaCrop-OSPy (FAO AquaCrop) mechanistic cross-check
]

# Probabilistic / ML weather forecasting feeding the stochastic MPC.
forecast = [
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

# Plotting for demo scripts and analysis notebooks.
viz = [
    "matplotlib>=3.7",
]

# API + analytical results store (precompute and serve architecture).
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "duckdb>=0.10",     # analytical queries over precomputed run results
    "pyarrow>=15.0",    # Parquet results storage
    "fpdf2>=2.7",       # one-page proposal PDF (E1b)
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
]

# Everything, for a full local dev environment.
all = [
    "aquareserve[control,rl,validation,forecast,viz,api,dev]",
]

[project.scripts]
aquareserve = "aquareserve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aquareserve = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI dependency injection puts Depends()/Header() in argument defaults by design.
"backend/app/*" = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]
